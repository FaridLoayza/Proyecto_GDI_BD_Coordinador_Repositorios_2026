# Genera PortalCRIS.exe (portal web: FastAPI + React compilado) para Windows.
#
# - Al subir un tag vX.Y.Z (git tag v1.0.0 && git push origin v1.0.0) crea un
#   release en GitHub con el .zip adjunto.
# - "Run workflow" (manual) solo compila y deja el .zip como artefacto.
name: Release Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/portal/package-lock.json

      - name: Compilar frontend React
        working-directory: frontend/portal
        run: |
          npm ci
          npm run build

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Dependencias del backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller

      - name: Pruebas del portal
        run: python -m unittest backend.pruebas.prueba_portal_web

      - name: Generar PortalCRIS.exe
        run: >
          pyinstaller --noconfirm --onefile --name PortalCRIS --paths .
          --collect-submodules uvicorn
          --add-data "frontend/portal/dist;frontend/portal/dist"
          --add-data "backend/database/base_datos_repositorio.sql;backend/database"
          backend/lanzador_windows.py

      - name: Probar el ejecutable
        shell: pwsh
        run: |
          $p = Start-Process dist/PortalCRIS.exe -PassThru -Environment @{ BROWSER = 'none'; PORTAL_PORT = '8765' }
          $ok = $false
          foreach ($i in 1..30) {
            try { if ((Invoke-RestMethod http://127.0.0.1:8765/api/health).status -eq 'ok') { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 1
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw 'PortalCRIS.exe no respondió en /api/health' }

      - name: Empaquetar (carpeta EJECUTABLE)
        shell: pwsh
        run: |
          $nombre = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $carpeta = "PortalCRIS-$nombre-windows"
          New-Item -ItemType Directory "$carpeta/sql" -Force | Out-Null
          Copy-Item dist/PortalCRIS.exe $carpeta/
          Copy-Item backend/config.ini.example $carpeta/
          Copy-Item "entrega/ejecutable/*" $carpeta/
          Copy-Item CREDENCIALES_PRUEBA.md "$carpeta/CREDENCIALES_PRUEBA.txt"
          Copy-Item backend/database/base_datos_repositorio.sql, backend/database/migracion_scopus_opcional.sql, backend/database/migracion_cuenta_administrador.sql, backend/database/migracion_entrega5.sql, backend/database/rol_admin_cris.sql "$carpeta/sql/"
          Compress-Archive -Path $carpeta -DestinationPath "$carpeta.zip"
          "ZIP=$carpeta.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PortalCRIS-windows
          path: ${{ env.ZIP }}

      - name: Publicar release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
